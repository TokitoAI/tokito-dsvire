<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid query core capacity evidence</title><desc id="desc">A deterministic synthetic run bounds MaxSim to 32 of 209 regions and reports latency, memory, and pack size.</desc>
  <rect width="1200" height="720" fill="#07111f"/><g font-family="Inter,Segoe UI,sans-serif">
  <text x="64" y="74" fill="#f7fafc" font-size="36" font-weight="700">Hybrid retrieval core · bounded by construction</text><text x="64" y="112" fill="#91a4ba" font-size="18">BM25 + dense candidates → RRF → exact MaxSim on at most K regions</text>
  <rect x="64" y="160" width="246" height="132" rx="16" fill="#10243b" stroke="#1ed6b5"/><text x="88" y="205" fill="#91a4ba" font-size="15">COMPLETE PACK</text><text x="88" y="258" fill="#f7fafc" font-size="42" font-weight="700">209</text><text x="190" y="258" fill="#91a4ba" font-size="18">regions</text>
  <rect x="334" y="160" width="246" height="132" rx="16" fill="#10243b" stroke="#1ed6b5"/><text x="358" y="205" fill="#91a4ba" font-size="15">BM25 / DENSE TOP-N</text><text x="358" y="258" fill="#f7fafc" font-size="42" font-weight="700">100</text><text x="448" y="258" fill="#91a4ba" font-size="18">each</text>
  <rect x="604" y="160" width="246" height="132" rx="16" fill="#10243b" stroke="#ffb454"/><text x="628" y="205" fill="#91a4ba" font-size="15">MAXSIM HARD CAP</text><text x="628" y="258" fill="#f7fafc" font-size="42" font-weight="700">32</text><text x="690" y="258" fill="#91a4ba" font-size="18">regions</text>
  <rect x="874" y="160" width="246" height="132" rx="16" fill="#10243b" stroke="#8d7dff"/><text x="898" y="205" fill="#91a4ba" font-size="15">QUERY SET</text><text x="898" y="258" fill="#f7fafc" font-size="42" font-weight="700">90</text><text x="960" y="258" fill="#91a4ba" font-size="18">queries</text>
  <text x="64" y="350" fill="#f7fafc" font-size="24" font-weight="700">Windows capacity observation</text><rect x="64" y="382" width="1056" height="166" rx="18" fill="#0d1b2d"/>
  <text x="100" y="425" fill="#91a4ba" font-size="15">MEAN QUERY</text><text x="100" y="477" fill="#1ed6b5" font-size="40" font-weight="700">44.08 ms</text><text x="370" y="425" fill="#91a4ba" font-size="15">P95 QUERY</text><text x="370" y="477" fill="#1ed6b5" font-size="40" font-weight="700">45.39 ms</text><text x="640" y="425" fill="#91a4ba" font-size="15">TRACED PEAK</text><text x="640" y="477" fill="#1ed6b5" font-size="40" font-weight="700">9.24 MB</text><text x="900" y="425" fill="#91a4ba" font-size="15">JSON PACK</text><text x="900" y="477" fill="#1ed6b5" font-size="40" font-weight="700">618 KB</text>
  <text x="100" y="522" fill="#91a4ba" font-size="15">Exact registry IDs/queries | 32D | 16 patches/region | exact MaxSim</text><text x="64" y="604" fill="#ffb454" font-size="17" font-weight="700">CAPACITY EVIDENCE, NOT RETRIEVAL ACCURACY</text><text x="64" y="636" fill="#91a4ba" font-size="15">Synthetic vectors exclude encoder, vector DB, network, EGVV, and cold pack download.</text><text x="64" y="668" fill="#667b93" font-size="13">Semantic SHA-256: 4e5ce7fd...872712 | order SHA-256: 5a470fd2...0d505</text></g>
</svg>
