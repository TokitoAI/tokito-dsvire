<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DS-ViRe source-free evidence bundle example</title>
  <desc id="desc">Three region-level evidence records with page, bounding box, content hash, and explicitly heuristic verification semantics.</desc>
  <rect width="1200" height="760" rx="28" fill="#090b10"/>
  <style>.title{font:700 34px Inter,Segoe UI,sans-serif;fill:#f4f7fb}.sub{font:18px Inter,Segoe UI,sans-serif;fill:#8d96a8}.label{font:600 14px Inter,Segoe UI,sans-serif;fill:#8d96a8}.value{font:700 20px Inter,Segoe UI,sans-serif;fill:#f4f7fb}.type{font:700 15px Inter,Segoe UI,sans-serif}.caption{font:600 16px Inter,Segoe UI,sans-serif;fill:#f4f7fb}.meta{font:15px Inter,Segoe UI,sans-serif;fill:#b5bfce}.mono{font:14px ui-monospace,Consolas,monospace;fill:#778398}.score{font:700 28px ui-monospace,Consolas,monospace;fill:#f4f7fb}.tiny{font:13px Inter,Segoe UI,sans-serif;fill:#8d96a8}</style>
  <text x="54" y="65" class="title">Evidence bundle · not a PDF dump</text>
  <text x="54" y="101" class="sub">Every result is a typed region with page, normalized geometry, hash, and score semantics.</text>
  <rect x="54" y="132" width="1092" height="112" rx="18" fill="#121720" stroke="#293140"/>
  <text x="82" y="164" class="label">EXACT PART IDENTITY</text><text x="82" y="198" class="value">Texas Instruments · TPS5430DDAR · SO-PowerPAD-8</text>
  <text x="82" y="224" class="mono">datasheet sha256 83074fc1265c8e5c6639511bdb9f83e9…</text>
  <rect x="54" y="278" width="1092" height="108" rx="16" fill="#121720" stroke="#293140"/><rect x="54" y="278" width="8" height="108" rx="4" fill="#16d6b3"/><text x="84" y="310" class="type" fill="#16d6b3">PINOUT</text><text x="218" y="310" class="caption">Figure 4-1. DDA Package 8-Pin HSOIC With Thermal Pad (Top View)</text><text x="84" y="343" class="meta">page 3 · bbox [0.229, 0.126, 0.776, 0.328]</text><text x="84" y="367" class="mono">crop sha256 5a42314371835832…</text><text x="900" y="348" class="score">0.97</text><text x="900" y="369" class="tiny">heuristic strength</text>
  <rect x="54" y="410" width="1092" height="108" rx="16" fill="#121720" stroke="#293140"/><rect x="54" y="410" width="8" height="108" rx="4" fill="#62a6ff"/><text x="84" y="442" class="type" fill="#62a6ff">TABLE</text><text x="218" y="442" class="caption">Table 4-1. Pin Functions</text><text x="84" y="475" class="meta">page 3 · bbox [0.065, 0.328, 0.935, 0.600]</text><text x="84" y="499" class="mono">crop sha256 7ba91a7a84540584…</text><text x="900" y="480" class="score">0.94</text><text x="900" y="501" class="tiny">heuristic strength</text>
  <rect x="54" y="542" width="1092" height="108" rx="16" fill="#121720" stroke="#293140"/><rect x="54" y="542" width="8" height="108" rx="4" fill="#a78bfa"/><text x="84" y="574" class="type" fill="#a78bfa">PACKAGE</text><text x="218" y="574" class="caption">DDA package identity and top-view pinout</text><text x="84" y="607" class="meta">page 3 · bbox [0.229, 0.126, 0.776, 0.328]</text><text x="84" y="631" class="mono">crop sha256 5a42314371835832…</text><text x="900" y="612" class="score">1.00</text><text x="900" y="633" class="tiny">heuristic strength</text>
  <rect x="54" y="686" width="1092" height="42" rx="12" fill="#2a1c13" stroke="#7c4a22"/><text x="76" y="713" class="caption" fill="#f3ba76">ABSTAIN: heuristic_evidence_strength is not calibrated_probability and cannot authorize publication.</text>
</svg>
