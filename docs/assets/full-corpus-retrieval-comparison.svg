<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Identity-assisted versus unscoped visual retrieval</title>
  <desc id="desc">Development comparison over the same complete registered query and candidate universe.</desc>
  <rect width="1200" height="700" rx="28" fill="#090b10"/>
  <style>.title{font:700 34px Inter,Segoe UI,sans-serif;fill:#f4f7fb}.sub{font:18px Inter,Segoe UI,sans-serif;fill:#8d96a8}.legend{font:16px Inter,Segoe UI,sans-serif;fill:#c8d0dc}.row{font:700 18px Inter,Segoe UI,sans-serif;fill:#c8d0dc}.mono{font:16px ui-monospace,Consolas,monospace;fill:#f4f7fb}.foot{font:14px Inter,Segoe UI,sans-serif;fill:#697386}</style>
  <text x="64" y="68" class="title">Same corpus, radically different information boundary</text>
  <text x="64" y="105" class="sub">90 queries x 209 registered crops = 18,810 scored pairs</text>
  <circle cx="72" cy="151" r="7" fill="#16d6b3"/><text x="90" y="157" class="legend">Identity-assisted text/layout</text>
  <circle cx="338" cy="151" r="7" fill="#a78bfa"/><text x="356" y="157" class="legend">Unscoped OpenCLIP pixels</text>
  <rect x="64" y="177" width="1072" height="42" rx="12" fill="#2a1c13" stroke="#7c4a22"/><text x="84" y="204" class="row">DEVELOPMENT ONLY - NOT HELD-OUT ACCURACY - NEITHER RESULT AUTHORIZES PUBLICATION</text>
  <text x="64" y="269" class="row">nDCG@5</text><rect x="220" y="244" width="720" height="22" rx="11" fill="#202631"/><rect x="220" y="244" width="693" height="22" rx="11" fill="#16d6b3"/><rect x="220" y="273" width="720" height="22" rx="11" fill="#202631"/><rect x="220" y="273" width="102" height="22" rx="11" fill="#a78bfa"/><text x="972" y="262" class="mono">0.963</text><text x="972" y="291" class="mono">0.141</text><text x="64" y="345" class="row">R@5</text><rect x="220" y="320" width="720" height="22" rx="11" fill="#202631"/><rect x="220" y="320" width="720" height="22" rx="11" fill="#16d6b3"/><rect x="220" y="349" width="720" height="22" rx="11" fill="#202631"/><rect x="220" y="349" width="136" height="22" rx="11" fill="#a78bfa"/><text x="972" y="338" class="mono">1.000</text><text x="972" y="367" class="mono">0.189</text><text x="64" y="421" class="row">mAP</text><rect x="220" y="396" width="720" height="22" rx="11" fill="#202631"/><rect x="220" y="396" width="684" height="22" rx="11" fill="#16d6b3"/><rect x="220" y="425" width="720" height="22" rx="11" fill="#202631"/><rect x="220" y="425" width="110" height="22" rx="11" fill="#a78bfa"/><text x="972" y="414" class="mono">0.950</text><text x="972" y="443" class="mono">0.152</text><text x="64" y="497" class="row">MRR</text><rect x="220" y="472" width="720" height="22" rx="11" fill="#202631"/><rect x="220" y="472" width="684" height="22" rx="11" fill="#16d6b3"/><rect x="220" y="501" width="720" height="22" rx="11" fill="#202631"/><rect x="220" y="501" width="110" height="22" rx="11" fill="#a78bfa"/><text x="972" y="490" class="mono">0.950</text><text x="972" y="519" class="mono">0.152</text>
  <text x="64" y="628" class="row">Unscoped nDCG@5 by intent: pinout 0.342 - package 0.061 - table 0.021</text>
  <text x="64" y="670" class="foot">OpenCLIP scorer sees only raw query text and rendered crop pixels; no identity, package, intent, document metadata, or labels.</text>
</svg>
