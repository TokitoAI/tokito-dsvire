name: OpenCLIP query benchmark
run-name: OpenCLIP query benchmark @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclip-query-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, X64, tokito-vps, private-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.3'
          enable-cache: true
      - run: python scripts/check_dependency_lock.py
      - name: Install frozen visual runtime
        run: uv sync --locked --extra test --extra visual --extra openclip
      - name: Audit resolved locked visual runtime
        run: |
          uv pip uninstall tokito-dsvire
          uv run --frozen --no-sync pip-audit --local --strict
          uv sync --locked --extra test --extra visual --extra openclip
      - name: Rank query text against every registered crop
        env:
          RESULT_DIR: ${{ github.workspace }}/artifacts
        run: |
          mkdir -p "$RESULT_DIR"
          result="$RESULT_DIR/openclip-query-development-${GITHUB_SHA}.json"
          uv run --frozen --no-sync python scripts/evaluate_full_corpus_openclip_baseline.py \
            --cache-root /opt/actions-runner/.dsvire-benchmark-sources \
            --download-cache "$RUNNER_TEMP/dsvire-openclip-query-sources" \
            --model /opt/actions-runner/.dsvire-benchmark-models/ac4f8c4b88af6d963118cbf40ad93176d092abbedfcb752601ae1866352656e6.safetensors \
            --json-out "$result"
          cd "$RESULT_DIR"
          sha256sum "$(basename "$result")" > "$(basename "$result").sha256"
      - name: Publish compact benchmark evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openclip-query-benchmark-${{ github.sha }}
          path: |
            artifacts/*.json
            artifacts/*.json.sha256
          if-no-files-found: error
          retention-days: 30
