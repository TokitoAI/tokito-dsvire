name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.3'
          enable-cache: true
      - run: python scripts/check_dependency_lock.py
      - run: uv sync --locked --extra test --extra visual
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .
      - run: uv run --frozen --no-sync python -m compileall -q src
      - run: uv run --frozen --no-sync pytest -q
      - run: uv run --frozen --no-sync python -m build --no-isolation
      - name: Audit resolved locked environment
        run: |
          uv pip uninstall tokito-dsvire
          uv run --frozen --no-sync pip-audit --local --strict
          uv sync --locked --extra test --extra visual
      - run: docker build --pull -t tokito-dsvire:ci .
      - name: Container refuses unsafe production configuration
        run: |
          if docker run --rm tokito-dsvire:ci; then
            echo "container unexpectedly started without DSVIRE_SERVICE_TOKEN" >&2
            exit 1
          fi
      - name: Container health smoke
        env:
          DSVIRE_CI_TOKEN: ci-service-token-that-is-at-least-32-bytes
        run: |
          docker run -d --name dsvire-ci \
            -e DSVIRE_SERVICE_TOKEN="$DSVIRE_CI_TOKEN" \
            -p 127.0.0.1::8081 tokito-dsvire:ci
          port=$(docker port dsvire-ci 8081/tcp | sed 's/.*://')
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/v1/ready"; then
              status=$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST -H 'content-type: application/pdf' \
                "http://127.0.0.1:${port}/v1/evidence/symbol?manufacturer=Acme&mpn=A1&package=SOIC-8")
              test "$status" = 401
              authenticated_status=$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST -H 'content-type: application/pdf' \
                -H "authorization: Bearer $DSVIRE_CI_TOKEN" \
                --data-binary '%PDF-fake' \
                "http://127.0.0.1:${port}/v1/evidence/symbol?manufacturer=Acme&mpn=A1&package=SOIC-8")
              test "$authenticated_status" = 422
              exit
            fi
            sleep 1
          done
          docker logs dsvire-ci
          exit 1
      - if: always()
        run: docker rm -f dsvire-ci 2>/dev/null || true
