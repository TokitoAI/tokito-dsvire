name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q src
      - run: python -m pytest -q
      - run: docker build --pull -t tokito-dsvire:ci .
      - name: Container health smoke
        run: |
          docker run -d --name dsvire-ci -p 127.0.0.1::8081 tokito-dsvire:ci
          port=$(docker port dsvire-ci 8081/tcp | sed 's/.*://')
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/v1/health"; then
              exit 0
            fi
            sleep 1
          done
          docker logs dsvire-ci
          exit 1
      - if: always()
        run: docker rm -f dsvire-ci 2>/dev/null || true
