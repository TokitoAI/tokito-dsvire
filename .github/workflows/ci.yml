name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.3'
          enable-cache: true
      - run: uv sync --locked --extra test --extra visual
      - name: Run release-wide verification
        run: >-
          uv run --frozen --no-sync python scripts/verify_release.py
          --json-out release-verification.json
      - name: Publish release verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.sha }}
          path: release-verification.json
          if-no-files-found: warn
          retention-days: 30
      - name: Export hostile PDF evidence
        run: >-
          uv run --frozen --no-sync python scripts/evaluate_hostile_pdfs.py
          --json-out hostile-pdf-evidence.json
      - name: Publish hostile PDF evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hostile-pdf-evidence-${{ github.sha }}
          path: hostile-pdf-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run production-boundary load evidence
        run: >-
          uv run --frozen --no-sync python scripts/evaluate_service_load.py
          --cold-requests 2 --warm-requests 4 --overload-requests 6
          --source-commit "$GITHUB_SHA"
          --json-out service-load-evidence.json
      - name: Publish service load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-load-evidence-${{ github.sha }}
          path: service-load-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Build production image twice without cache
        run: |
          docker build --pull --no-cache -t tokito-dsvire:repro-a .
          docker build --pull --no-cache -t tokito-dsvire:repro-b .
          docker tag tokito-dsvire:repro-a tokito-dsvire:ci
      - name: Compare independent production image root filesystems
        run: |
          docker create --name dsvire-repro-a tokito-dsvire:repro-a
          docker create --name dsvire-repro-b tokito-dsvire:repro-b
          docker export --output dsvire-rootfs-a.tar dsvire-repro-a
          docker export --output dsvire-rootfs-b.tar dsvire-repro-b
          first_id=$(docker image inspect --format '{{.Id}}' tokito-dsvire:repro-a)
          second_id=$(docker image inspect --format '{{.Id}}' tokito-dsvire:repro-b)
          base_image=$(head -n 1 Dockerfile | sed 's/^FROM //')
          uv run --frozen --no-sync python scripts/compare_image_rootfs.py \
            dsvire-rootfs-a.tar dsvire-rootfs-b.tar \
            --source-commit "$GITHUB_SHA" --base-image "$base_image" \
            --first-image-id "$first_id" --second-image-id "$second_id" \
            --json-out image-reproducibility.json \
            --inventory-out image-rootfs-inventory.json
      - name: Publish image reproducibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-reproducibility-${{ github.sha }}
          path: |
            image-reproducibility.json
            image-rootfs-inventory.json
          if-no-files-found: warn
          retention-days: 30
      - name: Container robustness corpus
        run: >-
          docker run --rm --entrypoint python tokito-dsvire:ci
          scripts/evaluate_robustness.py
      - name: Container runtime license audit
        run: >-
          docker run --rm --entrypoint python tokito-dsvire:ci
          scripts/audit_runtime_licenses.py
      - name: Container refuses unsafe production configuration
        run: |
          if docker run --rm tokito-dsvire:ci; then
            echo "container unexpectedly started without DSVIRE_SERVICE_TOKEN" >&2
            exit 1
          fi
      - name: Container health smoke
        env:
          DSVIRE_CI_TOKEN: ci-service-token-that-is-at-least-32-bytes
        run: |
          docker run -d --name dsvire-ci \
            -e DSVIRE_SERVICE_TOKEN="$DSVIRE_CI_TOKEN" \
            -p 127.0.0.1::8081 tokito-dsvire:ci
          port=$(docker port dsvire-ci 8081/tcp | sed 's/.*://')
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/v1/ready"; then
              status=$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST -H 'content-type: application/pdf' \
                "http://127.0.0.1:${port}/v1/evidence/symbol?manufacturer=Acme&mpn=A1&package=SOIC-8")
              test "$status" = 401
              authenticated_status=$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST -H 'content-type: application/pdf' \
                -H "authorization: Bearer $DSVIRE_CI_TOKEN" \
                --data-binary '%PDF-fake' \
                "http://127.0.0.1:${port}/v1/evidence/symbol?manufacturer=Acme&mpn=A1&package=SOIC-8")
              test "$authenticated_status" = 422
              exit
            fi
            sleep 1
          done
          docker logs dsvire-ci
          exit 1
      - if: always()
        run: >-
          docker rm -f dsvire-ci dsvire-repro-a dsvire-repro-b
          2>/dev/null || true
