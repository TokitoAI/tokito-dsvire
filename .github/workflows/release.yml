name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.3'
          enable-cache: true
      - run: uv sync --locked --extra test --extra visual
      - name: Run release-wide verification
        run: >-
          uv run --frozen --no-sync python scripts/verify_release.py
          --json-out release-verification.json
      - name: Require production-ready runtime licenses
        run: >-
          uv run --frozen --no-sync python scripts/audit_runtime_licenses.py
          --require-release-ready
      - name: Publish release verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.ref_name }}
          path: release-verification.json
          if-no-files-found: warn
          retention-days: 90
      - name: Hash-pinned real-PDF identity gate
        run: |
          uv run --frozen --no-sync python scripts/evaluate_identity.py \
            --cache-dir "$RUNNER_TEMP/dsvire-eval" \
            --json-out identity-eval.json
      - name: Publish identity evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: identity-eval-${{ github.ref_name }}
          path: identity-eval.json
          if-no-files-found: warn
      - run: docker build --pull -t tokito-dsvire:release-check .
      - name: Container robustness corpus
        run: >-
          docker run --rm --entrypoint python tokito-dsvire:release-check
          scripts/evaluate_robustness.py
      - name: Container runtime license audit
        run: >-
          docker run --rm --entrypoint python tokito-dsvire:release-check
          scripts/audit_runtime_licenses.py --require-release-ready
      - name: Container boundary smoke
        env:
          DSVIRE_CI_TOKEN: ci-service-token-that-is-at-least-32-bytes
        run: |
          if docker run --rm tokito-dsvire:release-check; then
            echo "container unexpectedly started without DSVIRE_SERVICE_TOKEN" >&2
            exit 1
          fi
          docker run -d --name dsvire-release-check \
            -e DSVIRE_SERVICE_TOKEN="$DSVIRE_CI_TOKEN" \
            -p 127.0.0.1::8081 tokito-dsvire:release-check
          port=$(docker port dsvire-release-check 8081/tcp | sed 's/.*://')
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/v1/ready"; then
              status=$(curl -sS -o /dev/null -w '%{http_code}' \
                -X POST -H 'content-type: application/pdf' \
                -H "authorization: Bearer $DSVIRE_CI_TOKEN" \
                --data-binary '%PDF-fake' \
                "http://127.0.0.1:${port}/v1/evidence/symbol?manufacturer=Acme&mpn=A1&package=SOIC-8")
              test "$status" = 422
              exit
            fi
            sleep 1
          done
          docker logs dsvire-release-check
          exit 1
      - if: always()
        run: docker rm -f dsvire-release-check 2>/dev/null || true

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tokitoai/tokito-dsvire:${{ github.ref_name }}
          provenance: true
          sbom: true

  github-release:
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
