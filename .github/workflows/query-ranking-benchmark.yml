name: query ranking benchmark
run-name: query ranking benchmark @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: query-ranking-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    # Stays on the self-hosted runner, unlike everything else in this repository,
    # because the step below reads the warm corpus cache at
    # /opt/actions-runner/.dsvire-benchmark-sources — a path that exists only
    # there. That cache is what makes this benchmark affordable; without it every
    # run re-fetches the whole datasheet corpus from vendor sites.
    #
    # The `tokito-vps` runner is being decommissioned, so this will stop being
    # dispatchable. Nothing breaks on push — it is workflow_dispatch only — but
    # reviving it means rehosting that cache somewhere the new CI can reach. It
    # cannot simply become a repository artifact: docs/TECHNICAL_BIBLE.md forbids
    # redistributing the PDFs.
    runs-on: [self-hosted, Linux, X64, tokito-vps, private-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.3'
          enable-cache: true
      - run: python scripts/check_dependency_lock.py
      - name: Install frozen benchmark runtime
        run: uv sync --locked --extra test --extra visual
      - name: Audit resolved locked benchmark environment
        run: |
          uv pip uninstall tokito-dsvire
          uv run --frozen --no-sync pip-audit --local --strict
          uv sync --locked --extra test --extra visual
      - name: Rank the complete registered development universe
        env:
          RESULT_DIR: ${{ github.workspace }}/artifacts
        run: |
          mkdir -p "$RESULT_DIR"
          result="$RESULT_DIR/query-ranking-text-development-${GITHUB_SHA}.json"
          uv run --frozen --no-sync python scripts/evaluate_full_corpus_text_baseline.py \
            --cache-root /opt/actions-runner/.dsvire-benchmark-sources \
            --download-cache "$RUNNER_TEMP/dsvire-query-sources" \
            --json-out "$result"
          cd "$RESULT_DIR"
          sha256sum "$(basename "$result")" > "$(basename "$result").sha256"
      - name: Publish compact benchmark evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: query-ranking-benchmark-${{ github.sha }}
          path: |
            artifacts/*.json
            artifacts/*.json.sha256
          if-no-files-found: error
          retention-days: 30
