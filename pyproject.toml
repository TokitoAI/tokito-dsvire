[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tokito-dsvire"
version = "0.5.0"
description = "Figure-level evidence retrieval for semiconductor datasheets"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.116,<1",
  "filelock>=3.20,<4",
  "pillow>=11.3,<13",
  "pypdf>=6.0,<7",
  "pypdfium2==5.12.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
visual = [
  "numpy>=2.0,<2.5",
  "onnxruntime>=1.27,<2",
  "psutil>=7.2.2,<8",
  "rapidocr>=3.9.2,<4",
]
openclip = [
  "open_clip_torch>=3.3,<4",
  "safetensors>=0.6,<1",
  "torch>=2.9,<3",
  "torchvision>=0.24,<1",
]
test = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.19,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "setuptools>=83,<84",
  "types-jsonschema>=4.23,<5",
  "types-psutil>=7.2,<8",
]
colsmol = [
    "huggingface-hub==1.5.0",
    "peft==0.19.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.5.0",
]

[tool.uv]
conflicts = [[{ extra = "colsmol" }, { extra = "openclip" }]]

[project.scripts]
dsvire = "dsvire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dsvire"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
[[tool.mypy.overrides]]
module = ["open_clip", "torch", "pypdfium2"]
ignore_missing_imports = true
