[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tokito-dsvire"
version = "0.6.3"
description = "Figure-level evidence retrieval for semiconductor datasheets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tokito" }]
keywords = ["datasheet", "retrieval", "semiconductor", "evidence", "pdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "asyncpg>=0.31,<1",
  "boto3>=1.43,<2",
  "fastapi>=0.116,<1",
  "filelock>=3.20,<4",
  "pillow>=11.3,<13",
  "pypdf>=6.16.1,<7",
  "pypdfium2==5.12.1",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.18,<2",
  "redis>=8.0,<9",
  "uvicorn[standard]>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/TokitoAI/tokito-dsvire"
Issues = "https://github.com/TokitoAI/tokito-dsvire/issues"
Documentation = "https://github.com/TokitoAI/tokito-dsvire/blob/main/docs/USAGE.md"
Changelog = "https://github.com/TokitoAI/tokito-dsvire/blob/main/CHANGELOG.md"
Security = "https://github.com/TokitoAI/tokito-dsvire/security/advisories"

[project.optional-dependencies]
mcp = [
  "mcp>=1.28,<2",
]
visual = [
  "numpy>=2.0,<2.5",
  "onnxruntime>=1.27,<2",
  "psutil>=7.2.2,<8",
  "rapidocr>=3.9.2,<4",
]
openclip = [
  "open_clip_torch>=3.3,<4",
  "safetensors>=0.6,<1",
  "torch>=2.9,<3",
  "torchvision>=0.24,<1",
]
test = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mypy>=1.19,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "setuptools>=83,<84",
  "types-jsonschema>=4.23,<5",
  "types-psutil>=7.2,<8",
]
colsmol = [
    "huggingface-hub==1.5.0",
    "peft==0.19.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.5.0",
]
colqwen = [
    "huggingface-hub==1.5.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.5.0",
]

[tool.uv]
conflicts = [
    [{ extra = "colsmol" }, { extra = "openclip" }],
    [{ extra = "colqwen" }, { extra = "openclip" }],
]

[project.scripts]
dsvire = "dsvire.cli:main"
dsvire-worker = "dsvire.platform_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dsvire"]

[tool.hatch.build.targets.wheel.force-include]
"src/dsvire/static/index.html" = "dsvire/static/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
[[tool.mypy.overrides]]
module = ["asyncpg", "boto3", "botocore.*", "open_clip", "torch", "pypdfium2", "onnxruntime"]
ignore_missing_imports = true
