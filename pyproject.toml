[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tokito-dsvire"
version = "0.1.0"
description = "Figure-level evidence retrieval for semiconductor datasheets"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.116,<1",
  "pillow>=11.3,<13",
  "pymupdf>=1.26,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pytest>=8.4,<10",
]

[project.scripts]
dsvire = "dsvire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dsvire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
